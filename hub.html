<style>
  :root {
    --bg: #fbfdfb;
    --snow: #eef6f0;
    --surface: #ffffff;
    --surface-2: #fdf6e6;
    --ink: #24302a;
    --ink-soft: #5c6b62;
    --line: #dfe9e2;
    --red: #c8323a;
    --red-soft: #fdeaea;
    --green: #24682f;
    --green-bright: #3a9a4a;
    --green-soft: #e4f3e7;
    --gold: #d9a93a;
    --gold-soft: #fbf1d8;
    --blue-soft: #e8f0fb;
    --blue: #2f5f9e;
    --shadow: 0 1px 2px rgba(36,104,47,.06), 0 8px 24px rgba(36,104,47,.08);
    --radius: 16px;
    color-scheme: light only;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; color: var(--ink); background: linear-gradient(180deg, var(--snow) 0, var(--bg) 420px) var(--bg);
    font: 16px/1.5 "Nunito", system-ui, -apple-system, sans-serif; min-height: 100vh;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; line-height: 1.15; margin: 0; color: var(--green); }
  a { color: var(--green); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  .tartan {
    height: 10px;
    background:
      repeating-linear-gradient(90deg, transparent 0 14px, rgba(36,104,47,.75) 14px 24px, transparent 24px 30px, rgba(255,255,255,.85) 30px 31px, transparent 31px 44px),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(36,104,47,.55) 3px 7px, transparent 7px 12px),
      #d23a3f;
  }
  .hidden { display: none !important; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 14px; }
  .tiny { font-size: 12.5px; }

  /* header */
  .brand { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
  .brand img { width: 52px; height: 52px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #fff, 0 0 0 4px rgba(217,169,58,.6); flex: none; }
  .brand h1 { font-size: 22px; }
  .brand .sub { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .who { margin-left: auto; text-align: right; font-size: 14px; line-height: 1.3; }
  .who b { display: block; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; cursor: pointer; font-size: 13.5px; }
  @media (max-width: 560px) {
    .brand .sub, #me-role { display: none; } .brand h1 { font-size: 18px; } .brand img { width: 44px; height: 44px; }
    .who { font-size: 13px; } .who br { display: none; }
  }

  /* nav */
  nav.tabs {
    position: sticky; top: 0; z-index: 20; background: rgba(251,253,251,.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 6px; padding-bottom: 6px; }
  nav.tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; cursor: pointer;
    font-weight: 800; font-size: 14.5px; color: var(--ink-soft); display: inline-flex; gap: 6px; align-items: center;
  }
  .tab[aria-selected="true"] { background: var(--green); color: #fff; }
  .tab .count { background: var(--red); color: #fff; border-radius: 999px; font-size: 11.5px; padding: 0 7px; line-height: 18px; }
  .tab[aria-selected="true"] .count { background: #fff; color: var(--green); }

  main { padding: 18px 0 80px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .stack > * + * { margin-top: 12px; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
  .section-title h2 { font-size: 22px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }

  .btn {
    border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 800; cursor: pointer; font-size: 14.5px;
    background: var(--green); color: #fff; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn.red { background: var(--red); }
  .btn.gold { background: var(--gold); color: #3a2a05; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .btn.sm { padding: 6px 12px; font-size: 13.5px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:focus-visible, .tab:focus-visible, input:focus, select:focus, textarea:focus, .fam-head:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }

  input[type=text], input[type=tel], input[type=email], input[type=search], input[type=password], select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px;
  }
  textarea { min-height: 70px; resize: vertical; }
  label.f { display: block; font-weight: 700; font-size: 14px; }
  label.f > input, label.f > select, label.f > textarea { margin-top: 5px; font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
    font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
  .b-pending { background: var(--gold-soft); color: #7a5a08; }
  .b-available { background: var(--blue-soft); color: var(--blue); }
  .b-adopted { background: var(--green-soft); color: var(--green); }
  .b-delivered { background: var(--green); color: #fff; }
  .b-hidden { background: #eee; color: #555; }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-role { background: var(--surface-2); color: #7a5a08; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .stat { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; cursor: pointer; box-shadow: var(--shadow); }
  .stat b { display: block; font-family: "Fraunces", Georgia, serif; font-size: 28px; color: var(--green); line-height: 1.1; }
  .stat span { font-size: 13.5px; color: var(--ink-soft); font-weight: 700; }
  .stat.alert b { color: var(--red); }

  /* lists */
  .help-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .help-item:first-child { border-top: 0; padding-top: 2px; }
  .help-item .ico { font-size: 22px; flex: none; width: 30px; text-align: center; }
  .help-item .btn { white-space: nowrap; flex: none; }
  .feed-item { padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14.5px; }
  .feed-item:first-child { border-top: 0; }
  .feed-who { background: none; border: 0; padding: 0; font: inherit; font-weight: 800; color: var(--green); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .feed-link { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .feed-link .go { color: var(--green); font-weight: 700; white-space: nowrap; }
  .feed-link:hover .what, .feed-link:focus-visible .what { text-decoration: underline; }
  .map-box { height: 400px; border-radius: 12px; overflow: hidden; background: #e8eef0; z-index: 0; }
  @media (max-width: 600px) { .map-box { height: 340px; } }
  .pin { width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.45); font-family: system-ui, sans-serif; }
  .pin.done { opacity: .55; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .cheer-photo { margin-top: 10px; }
  .cheer-photo img { display: block; width: 100%; max-height: 520px; object-fit: cover; border-radius: 12px; background: var(--line); }
  .react { border: 1.5px solid var(--line); background: var(--card, #fff); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 15px; cursor: pointer; min-height: 36px; }
  .react.on { border-color: var(--green); background: #e7f3ea; font-weight: 700; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 4px var(--gold); } 100% { box-shadow: none; } }
  .flash { animation: flash 2.4s ease-out; }

  .task { border-left: 5px solid var(--gold); }
  .task.claimed { border-left-color: var(--blue); }
  .task.done { border-left-color: var(--green-bright); opacity: .8; }
  .task h3 { font-family: "Nunito", sans-serif; font-size: 16.5px; color: var(--ink); font-weight: 800; }
  .meta { font-size: 13px; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; }

  /* families */
  .fam { padding: 0; overflow: hidden; }
  .fam-head { display: flex; gap: 10px; align-items: center; padding: 14px 16px; cursor: pointer; width: 100%; background: none; border: 0; text-align: left; }
  .fam-head h3 { font-size: 19px; }
  .fam-body { border-top: 1px solid var(--line); padding: 14px 16px 16px; }
  .kidline { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .nextline { font-size: 14px; margin-top: 6px; color: var(--ink); }
  .nextline b { color: var(--green); }
  .lastline { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .kid { padding: 8px 0; border-top: 1px dashed var(--line); }
  .kid:first-child { border-top: 0; }
  .block { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .block.private { background: var(--red-soft); border-color: #f3c9cb; }
  .block h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
  .block.private h4 { color: var(--red); }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .step.done { background: var(--green-soft); border-color: var(--green-soft); color: var(--green); }
  .step.now { background: var(--green); border-color: var(--green); color: #fff; }
  .notes { white-space: pre-wrap; font-size: 14px; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 14.5px; }
  dl.kv dt { color: var(--ink-soft); font-weight: 700; }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }

  .story-box { white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--gold); border-radius: 12px; padding: 12px; font-size: 15px; }

  .empty { text-align: center; color: var(--ink-soft); padding: 24px 10px; }
  .banner { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }

  /* chat */
  .chat-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 12px; }
  @media (max-width: 700px) { .chat-wrap { grid-template-columns: 1fr; } }
  .chan-list { display: flex; flex-direction: column; gap: 4px; }
  @media (max-width: 700px) { .chan-list { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .chan-list::-webkit-scrollbar { display: none; } }
  .chan { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; text-align: left; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chan[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .chan .count { margin-left: auto; background: var(--red); color: #fff; border-radius: 999px; font-size: 11.5px; padding: 0 7px; line-height: 18px; }
  .chat-box { display: flex; flex-direction: column; height: min(68vh, 640px); padding: 0; overflow: hidden; }
  .chat-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 800; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
  .msg-row { display: flex; flex-direction: column; align-items: flex-start; max-width: 85%; }
  .msg-row.mine { align-self: flex-end; align-items: flex-end; }
  .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .mine .bubble { background: var(--green); color: #fff; border-color: var(--green); border-radius: 14px 14px 4px 14px; }
  .msg-meta { font-size: 11.5px; color: var(--ink-soft); margin: 2px 4px; }
  .chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--surface); }
  .chat-form textarea { min-height: 44px; max-height: 140px; flex: 1; }
  .flag { background: var(--red-soft); border: 1px solid #f3c9cb; color: var(--red); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; font-weight: 700; }

  /* login */
  .login { max-width: 440px; margin: 30px auto; }
  .login .logo { display: block; width: 150px; height: 150px; margin: 0 auto 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px #fff, 0 0 0 7px rgba(217,169,58,.55), 0 14px 34px rgba(36,104,47,.16); }
  .login h1 { text-align: center; font-size: 30px; }
  .login .elves { text-align: center; color: var(--ink-soft); margin: 6px 0 18px; font-size: 14.5px; }
  .login .elves b { color: var(--red); }

  /* modal + toast */
  .overlay { position: fixed; inset: 0; background: rgba(20,30,24,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); border-radius: 18px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal img { max-width: 100%; border-radius: 10px; display: block; margin: 0 auto; }
  .codebig { font-family: ui-monospace, Menlo, monospace; font-size: 30px; font-weight: 800; letter-spacing: .08em; text-align: center; background: var(--gold-soft); border: 2px dashed var(--gold); border-radius: 12px; padding: 12px; margin: 10px 0; user-select: all; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.err { background: var(--red); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw3hH_RCsag3kpqohxNVZVGdIiA2f-XzsBlO_8ovpJhGDgUurZkjYJiLKo7wMjt7ljufQ/exec",
  REFRESH_SECONDS: 60,
  GOFUNDME: "https://gofund.me/4cf21e0cc"
};
/* ================================================== */

const $ = (s, el = document) => el.querySelector(s);
const STORE_KEY = "ks-hub-cred";

/* ---------- tiny DOM helper (text is always set safely) ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k === "checked" || k === "disabled" || k === "selected") el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const opt = (value, label, sel) => h("option", { value, selected: sel }, label ?? value);

/* ---------- storage (per device convenience only) ---------- */
function loadCred() {
  try { const s = localStorage.getItem(STORE_KEY) || sessionStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function saveCred(c, remember) {
  try {
    localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY);
    (remember ? localStorage : sessionStorage).setItem(STORE_KEY, JSON.stringify(c));
  } catch (e) {}
}
function clearCred() { try { localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY); } catch (e) {} }

/* ---------- state ---------- */
let cred = null, me = null, S = null, memCred = null;
const ui = {
  tab: "home", famFilter: null, famSearch: "", open: new Set(), taskFilter: "open", taskArea: "",
  newTask: null, storiesAll: false, crewWants: "", pendingRender: false, busy: false,
  drafts: {}, inflight: 0, lastSubmit: null
};

/* ---------- drafts: whatever you've typed survives refreshes ---------- */
// Every form in the hub gets a data-draft key. As you type we keep a copy, and when the
// page redraws (new info from the crew, a refresh) we put your words right back.
const fieldsOf = form => [...form.elements].filter(el => /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== "hidden" && el.type !== "file");
// Fields are matched by name (or by position among unnamed fields), so a form that grows
// a new box, like the photo checkbox on Cheers, still gets your words back.
const fieldKeys = form => { let n = 0; return fieldsOf(form).map(el => [el.name ? "n:" + el.name + (el.type === "radio" ? ":" + el.value : "") : "i:" + (n++), el]); };
function saveDraft(form) {
  const key = form.dataset.draft; if (!key) return;
  const d = {};
  fieldKeys(form).forEach(([k, el]) => { d[k] = el.type === "checkbox" || el.type === "radio" ? el.checked : el.value; });
  ui.drafts[key] = d;
}
function restoreDrafts(root) {
  root.querySelectorAll("form[data-draft]").forEach(form => {
    const d = ui.drafts[form.dataset.draft]; if (!d) return;
    fieldKeys(form).forEach(([k, el]) => {
      if (!(k in d)) return;
      if (el.type === "checkbox" || el.type === "radio") el.checked = d[k]; else el.value = d[k];
    });
  });
}
const draftEvent = e => { const f = e.target && e.target.closest && e.target.closest("form[data-draft]"); if (f) saveDraft(f); };
document.addEventListener("input", draftEvent, true);
document.addEventListener("change", draftEvent, true);
document.addEventListener("submit", e => { const f = e.target.closest && e.target.closest("form[data-draft]"); ui.lastSubmit = f ? f.dataset.draft : null; if (f) saveDraft(f); setTimeout(() => { ui.lastSubmit = null; }, 0); }, true);

// Don't redraw the page out from under someone who's tapping or typing.
let lastPointer = 0;
document.addEventListener("pointerdown", () => { lastPointer = Date.now(); }, true);
document.addEventListener("touchstart", () => { lastPointer = Date.now(); }, { capture: true, passive: true });
const userBusy = () => isEditing() || Date.now() - lastPointer < 1500 || ui.inflight > 0;
function schedulePending() {
  if (ui.pendingTimer) return;
  ui.pendingTimer = setTimeout(() => { ui.pendingTimer = null; if (ui.pendingRender) render(false); }, 1600);
}

/* ---------- API ---------- */
// Phones drop connections. Try up to 3 times; each save carries an id so the server
// never does the same thing twice if an earlier try actually got through.
const newRid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
async function postHub(body, tries) {
  for (let i = 0; i < tries; i++) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 40000);
      const r = await fetch(CONFIG.SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctl.signal });
      const text = await r.text(); clearTimeout(timer);
      return JSON.parse(text);
    } catch (e) {
      if (i < tries - 1) await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
  const err = new Error("We couldn't reach the hub, so that didn't save. Check your signal and try again. Your typing is still there.");
  err.net = true; throw err;
}
let reqSeq = 0, appliedSeq = 0;
async function api(action, payload = {}, quiet) {
  const c = cred || memCred;
  const my = ++reqSeq, saving = action !== "state";
  const draftKey = saving ? ui.lastSubmit : null;   // the form this save came from, if any
  if (saving) ui.inflight++;
  let res;
  try {
    res = await postHub({ type: "hub", action, login: c.login, code: c.code, rid: saving ? newRid() : "", ...payload }, saving ? 3 : 1);
  } catch (e) {
    if (!quiet) toast(e.message, true);
    throw e;
  } finally { if (saving) ui.inflight--; }
  if (res.auth === false) { logout(res.error); throw new Error(res.error); }
  if (!res.ok) { if (!quiet) toast(res.error || "Something went wrong.", true); throw new Error(res.error); }
  if (draftKey) delete ui.drafts[draftKey];
  // A slow background refresh that started before this save must not overwrite it.
  if (res.state && (saving || my > appliedSeq)) {
    appliedSeq = Math.max(appliedSeq, my);
    const oldChat = S && S.chat ? S.chat : [];
    S = res.state; S.chat = S.chat || []; me = res.me; mergeChat(oldChat);
    render(!quiet || saving);
  }
  if (res.msg && !quiet) toast(res.msg);
  return res;
}
async function act(btn, action, payload) {
  if (btn) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.replaceChildren(h("span", { class: "spin" }), " Saving"); }
  try { return await api(action, payload); }
  catch (e) { if (!/match|paused/.test(e.message || "")) {} return null; }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.label; } }
}

/* ---------- login / logout ---------- */
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, msg = $("#login-msg");
  const c = { login: f.login.value.trim(), code: f.code.value.trim() };
  msg.classList.add("hidden");
  if (!c.login || !c.code) { msg.textContent = "Please enter your email or phone and your ELF code."; msg.classList.remove("hidden"); return; }
  const btn = $("button[type=submit]", f); btn.disabled = true; btn.textContent = "Checking your code…";
  try {
    const res = await fetch(CONFIG.SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ type: "hub", action: "login", ...c }) }).then(r => r.json());
    if (!res.ok) throw new Error(res.error || "That didn't work.");
    cred = c; memCred = c; saveCred(c, f.remember.checked);
    S = res.state; S.chat = S.chat || []; me = res.me; showApp();
    toast("Welcome, " + firstName(me.name) + "! 🎄");
  } catch (err) {
    msg.textContent = err.message || "We couldn't reach the hub. Check your connection.";
    msg.classList.remove("hidden");
  } finally { btn.disabled = false; btn.textContent = "Open the hub"; }
});
function logout(message) {
  clearCred(); cred = null; memCred = null; me = null; S = null;
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
  const msg = $("#login-msg");
  if (message) { msg.textContent = message; msg.classList.remove("hidden"); } else msg.classList.add("hidden");

async function shrinkPhoto(file) {
  let src;
  try { src = await createImageBitmap(file); }
  catch (e) {
    src = await new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); }; img.src = url; });
  }
  const w = src.width || src.naturalWidth, hgt = src.height || src.naturalHeight, k = Math.min(1, 1400 / Math.max(w, hgt));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(hgt * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.8));
  if (!blob) throw new Error("encode");
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
  return { type: "image/jpeg", data, preview: URL.createObjectURL(blob) };
}

    waiting.length ? h("div", { class: "row small" }, h("b", null, "🔔 New in:"),
      waiting.map(c => h("button", { class: "btn sm gold", onclick: () => { ui.chatCh = c.id; render(true); } }, c.label + " (" + unreadIn(c.id) + ")"))) : null,
    h("div", { class: "chat-wrap" },
      h("div", { class: "chan-list", role: "group", "aria-label": "Chats" },
        chans.map(c => h("button", { class: "chan", "aria-pressed": String(c.id === ui.chatCh), onclick: () => { ui.chatCh = c.id; render(true); } },
          c.label, c.id !== ui.chatCh && unreadIn(c.id) ? h("span", { class: "count", text: unreadIn(c.id) }) : null)),
        others.length ? dmPick : null),
      h("div", { class: "card chat-box" },
        h("div", { class: "chat-head", text: cur.label + (cur.id === "adopt" ? " · Adoption ELVES and Leads" : cur.id.startsWith("team:") ? " · this Santa team" : cur.id.startsWith("dm:") ? " · just the two of you" : " · the whole crew") }),
        msgs, form)));
}
function fillMessages(box) {
  box = box || document.getElementById("chat-msgs"); if (!box) return;
  const list = S.chat.filter(m => m.ch === ui.chatCh);
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.replaceChildren(...(list.length ? list.map(m => {
    const mine = m.fromId === me.id;
    return h("div", { class: "msg-row" + (mine ? " mine" : "") },
      h("div", { class: "msg-meta", text: (mine ? "You" : firstName(m.from)) + " · " + ago(m.when) }),
      h("div", { class: "bubble", text: m.text }));
  }) : [h("div", { class: "empty", text: "No messages yet. Say hi to the crew! 👋" })]));
  if (atBottom || !box.dataset.ready) { box.scrollTop = box.scrollHeight; box.dataset.ready = "1"; }
  markSeen(ui.chatCh);
}
function mergeChat(list) {
  if (!list || !list.length) return;
  const key = m => m.when + "|" + m.fromId + "|" + m.text;
  const have = new Set(S.chat.map(key));
  list.forEach(m => { if (!have.has(key(m))) S.chat.push(m); });
  S.chat.sort((a, b) => a.when < b.when ? -1 : 1);
}
async function chatCall(action, payload) {
  const c = cred || memCred;
  const since = S.chat.length ? S.chat[S.chat.length - 1].when : "";
  const res = await postHub({ type: "hub", action, login: c.login, code: c.code, since, ...payload }, action === "chat_send" ? 3 : 1);
  if (res.auth === false) { logout(res.error); throw new Error(res.error); }
  if (!res.ok) throw new Error(res.error || "Something went wrong.");
  return res;
}
// Quick chat refresh while the Chat tab is open.
setInterval(async () => {
  if (!S || !me || ui.tab !== "chat" || document.visibilityState !== "visible" || !(cred || memCred)) return;
  try { const res = await chatCall("chat", {}); if (res.chat && res.chat.length) { mergeChat(res.chat); fillMessages(); } } catch (e) {}
}, 8000);
function showCode(x) {
  const msg = "Hi " + firstName(x.name) + "! You're one of Santa's ELVES 🎅 Here's your way into Santa's Operations Hub:\n" +
    new URL("hub.html", S.publicUrl || location.href).href + "\nSign in with your phone number or email.\nYour ELF code: " + x.code;
  const p = String(x.phone || "").replace(/[^\d+]/g, "");
  modal(h("h3", { text: (x.existing ? "" : "🎉 ") + firstName(x.name) + "'s ELF code" }),
    h("div", { class: "codebig", text: x.code }),
    h("p", { class: "small muted", text: x.emailed ? "We emailed it to them. You can also text it:" : "Send it to them:" }),
    h("div", { class: "row" },
      p ? h("a", { class: "btn", href: "sms:" + p + "?&body=" + encodeURIComponent(msg) }, "💬 Text it") : null,
      h("button", { class: "btn ghost", onclick: () => copyText(msg) }, "📋 Copy message")));
}

/* ================= STORIES ================= */
function storyPost(f) {
  const kids = f.kids.map(k => (k.name || (k.gender === "Boy" ? "a little guy" : k.gender === "Girl" ? "a little girl" : "a kiddo")) + (k.age ? " (" + k.age + ")" : ""));
  const kidsText = kids.length > 1 ? kids.slice(0, -1).join(", ") + " and " + kids[kids.length - 1] : kids[0] || "";
  const lines = ["🎄 Meet Family " + f.id, "", kidsText];
  if (f.story) lines.push("", f.story.trim());
  else {
    const w = f.kids.filter(k => k.wishes).map(k => (k.name || "One of the kids") + " is wishing for " + k.wishes.toLowerCase().replace(/[.!]+$/, ""));
    if (w.length) lines.push("", w.join(". ") + ".");
  }
  lines.push("", "Could you be their Christmas angel? Adopt Family " + f.id + " here:", adoptLink(f.id), "", "#KiltedSantaProject #KiltedSanta");
  return lines.join("\n");
}
function viewStories() {
  const ok = S.families.filter(f => !isSwing(f) && /^(Yes|Story only)/.test(f.share) && f.status !== "Pending review" && f.status !== "Not listed");
  const list = ui.storiesAll ? ok : ok.filter(f => f.status === "Available");
  return h("div", { class: "stack" },
    h("div", { class: "section-title", style: "margin-top:0" }, h("h2", null, "Story posts")),
    gfmCard(false),
    h("div", { class: "banner" }, "Ready to copy and post. These only include families who said yes, with kids' first names and ages, never photos, last names or addresses. Each post links straight to that family's Adopt page."),
    h("div", { class: "chips" },
      h("button", { class: "chip", "aria-pressed": String(!ui.storiesAll), onclick: () => { ui.storiesAll = false; render(); } }, "Still need an adopter (" + ok.filter(f => f.status === "Available").length + ")"),
      h("button", { class: "chip", "aria-pressed": String(ui.storiesAll), onclick: () => { ui.storiesAll = true; render(); } }, "All OK to share (" + ok.length + ")")),
    list.length ? list.map(f => {
      const text = storyPost(f);
      return h("div", { class: "card stack" },
        h("div", { class: "row" }, h("b", { text: "Family " + f.id }), statusBadge(f.status)),
        h("div", { class: "story-box", text: text }),
        h("div", { class: "row" },
          h("button", { class: "btn", onclick: () => copyText(text) }, "📋 Copy post"),
          h("button", { class: "btn ghost sm", onclick: () => copyText(adoptLink(f.id)) }, "🔗 Copy link only"),
          f.status !== "Available" ? h("span", { class: "small muted", text: "Already " + f.status.toLowerCase() + ". Post a thank-you instead!" }) : null));
    }) : h("div", { class: "card empty", text: "No stories ready yet. Once an Adoption ELF approves a family who said yes to sharing, their post shows up here." }));
}

/* ================= GOFUNDME ================= */
function gfmPost() {
  return "🎅 Help fill Santa's sleigh!\n\nEvery year, the Kilted Santa Project brings Christmas to local families in Jackson County, delivered right to their door by Santas in kilts. Every dollar helps.\n\nGive here: " + CONFIG.GOFUNDME + "\n\n#KiltedSantaProject #KiltedSanta";
}
async function shareGfm() {
  if (navigator.share) {
    try { await navigator.share({ title: "Help fill Santa's sleigh", text: gfmPost().replace(CONFIG.GOFUNDME, "").trim(), url: CONFIG.GOFUNDME }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  copyText(gfmPost());
}
function gfmCard(compact) {
  return h("div", { class: "card stack", style: "border:2px solid var(--gold);background:linear-gradient(135deg,#fff,#fbf1d8)" },
    h("div", { class: "row" }, h("h3", { style: "font-size:20px", text: "💝 Share the GoFundMe" }),
      h("a", { class: "small", style: "margin-left:auto", href: CONFIG.GOFUNDME, target: "_blank", rel: "noopener" }, "gofund.me/4cf21e0cc")),
    compact ? null : h("div", { class: "story-box", text: gfmPost() }),
    h("div", { class: "row" },
      h("button", { class: "btn red", onclick: shareGfm }, "📤 Share"),
      h("button", { class: "btn ghost sm", onclick: () => copyText(gfmPost()) }, "📋 Copy post"),
      h("button", { class: "btn ghost sm", onclick: () => copyText(CONFIG.GOFUNDME) }, "🔗 Copy link"),
      h("button", { class: "btn ghost sm", onclick: openPrintables }, "🖨️ Print QR flyer")));
}

/* ================= PRINTABLES ================= */
const BIZ_PREFIX = "🏪 ";
function openPrintables() {
  const mine = S.crew.find(c => c.row === me.row) || {};
  try { sessionStorage.setItem("ks-elf-contact", JSON.stringify({ name: firstName(me.name), phone: mine.phone || "" })); } catch (e) {}
  location.href = new URL("resources.html", location.href).href;
}
function viewPrint() {
  const helps = [
    ["dropoff", "Be a gift drop-off spot"], ["gifts", "Donate new, unwrapped gifts"], ["wrap", "Donate wrapping supplies"],
    ["cards", "Donate gift cards"], ["adopt", "Adopt a family as a team"], ["share", "Share posts / hang a flyer"]
  ];
  const form = h("form", { class: "card stack", "data-draft": "biz", onsubmit: async e => {
      e.preventDefault();
      const fd = new FormData(form);
      const biz = String(fd.get("biz") || "").trim();
      const picked = helps.filter(([k]) => fd.get(k)).map(([, l]) => l);
      if (!biz) { toast("Add the business name.", true); return; }
      if (!picked.length) { toast("Check at least one way they're helping.", true); return; }
      const drop = picked.includes(helps[0][1]);
      const details = [
        "They said yes to: " + picked.join(", ") + ".",
        fd.get("contact") ? "Contact: " + fd.get("contact") : "",
        fd.get("times") ? "Best pickup times: " + fd.get("times") : "",
        fd.get("thanks") ? "OK to thank them by name online." : "Please don't name them online.",
        fd.get("notes") ? "Notes: " + fd.get("notes") : "",
        "Visited by " + firstName(me.name) + "."
      ].filter(Boolean).join("\n");
      const title = BIZ_PREFIX + biz + (drop ? ": set up drop-off box & schedule pickups" : ": follow up & collect donation");
      const r = await act($("button[type=submit]", form), "task_create", {
        title, area: drop ? "Pickups & drop-offs" : "Spread the word", details, due: String(fd.get("due") || "")
      });
      if (r) { form.reset(); toast(biz + " is logged. Thank you! 🎉"); }
    } },
    h("h3", null, "A business said yes? Log it here"),
    h("p", { class: "small muted", style: "margin:0" }, "This posts a task on the board, so someone sets up the box, picks up gifts, or sends a thank-you."),
    h("div", { class: "grid2" },
      h("label", { class: "f" }, "Business name", h("input", { type: "text", name: "biz", maxlength: 60, required: true })),
      h("label", { class: "f" }, "Contact (name & phone)", h("input", { type: "text", name: "contact", maxlength: 120 })),
      h("label", { class: "f" }, "Best pickup times", h("input", { type: "text", name: "times", maxlength: 120, placeholder: "e.g. Tue & Fri after 3" })),
      h("label", { class: "f" }, "Follow up by (optional)", h("input", { type: "text", name: "due", maxlength: 40, placeholder: "e.g. Nov 15" }))),
    h("div", null, h("b", { class: "small" }, "They'd like to:"),
      h("div", { class: "grid2", style: "margin-top:6px" }, helps.map(([k, l]) => h("label", { class: "row small" },
        h("input", { type: "checkbox", name: k, style: "width:18px;height:18px;accent-color:var(--green)" }), l)))),
    h("label", { class: "row small" }, h("input", { type: "checkbox", name: "thanks", style: "width:18px;height:18px;accent-color:var(--green)" }), "OK to thank them by name online"),
    h("label", { class: "f" }, "Notes (optional)", h("textarea", { name: "notes", maxlength: 500 })),
    h("div", null, h("button", { class: "btn", type: "submit" }, "Log this business")));

  const bizTasks = S.tasks.filter(t => t.title.startsWith(BIZ_PREFIX)).slice().reverse();
  return h("div", { class: "stack" },
    h("div", { class: "section-title", style: "margin-top:0" }, h("h2", null, "Printables")),
    h("div", { class: "card stack", style: "background:linear-gradient(135deg,#fff,#fdf6e6)" },
      h("h3", { style: "font-size:20px" }, "🏪 Business outreach kit"),
      h("p", { style: "margin:0" }, "Everything you need to ask a local business to help: a letter that explains the project, sign-up cards they fill out, and a window sign and box labels for drop-off spots. Your name and phone print on the letter."),
      h("p", { style: "margin:0" }, "💝 Also in there: a GoFundMe flyer with a big QR code, and little QR cards (4 per page) to leave by a register. The letter and window sign have the GoFundMe QR code too."),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: openPrintables }, "🖨️ Open the printables"))),
    form,
    h("div", { class: "section-title" }, h("h2", null, "Businesses helping (" + bizTasks.length + ")")),
    bizTasks.length ? h("div", { class: "stack" }, bizTasks.map(taskCard))
      : h("div", { class: "card empty", text: "No businesses logged yet. Be the first ELF to bring one on board!" }));
}

/* ---------- start ---------- */
(async function start() {
  try { $("#signup-link").href = new URL("./#volunteer", location.href).href; } catch (e) {}
  const saved = loadCred();
  if (!saved) { $("#login").classList.remove("hidden"); return; }
  cred = saved; memCred = saved;
  $("#login").classList.remove("hidden");
  const form = $("#login-form"); form.login.value = saved.login;
  const btn = $("button[type=submit]", form); btn.disabled = true; btn.textContent = "Opening the hub…";
  try { await api("state", {}, true); showApp(); }
  catch (e) { if (cred) { $("#login-msg").textContent = "We couldn't reach the hub. Check your connection and try again."; $("#login-msg").classList.remove("hidden"); } }
  finally { btn.disabled = false; btn.textContent = "Open the hub"; }
})();
</script>
