<style>
  :root {
    --bg: #fbfdfb;
    --snow: #eef6f0;
    --surface: #ffffff;
    --surface-2: #fdf6e6;
    --ink: #24302a;
    --ink-soft: #5c6b62;
    --line: #dfe9e2;
    --red: #c8323a;
    --red-soft: #fdeaea;
    --green: #24682f;
    --green-bright: #3a9a4a;
    --green-soft: #e4f3e7;
    --gold: #d9a93a;
    --gold-soft: #fbf1d8;
    --blue-soft: #e8f0fb;
    --blue: #2f5f9e;
    --shadow: 0 1px 2px rgba(36,104,47,.06), 0 8px 24px rgba(36,104,47,.08);
    --radius: 16px;
    color-scheme: light only;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0; color: var(--ink); background: linear-gradient(180deg, var(--snow) 0, var(--bg) 420px) var(--bg);
    font: 16px/1.5 "Nunito", system-ui, -apple-system, sans-serif; min-height: 100vh;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; line-height: 1.15; margin: 0; color: var(--green); }
  a { color: var(--green); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  .tartan {
    height: 10px;
    background:
      repeating-linear-gradient(90deg, transparent 0 14px, rgba(36,104,47,.75) 14px 24px, transparent 24px 30px, rgba(255,255,255,.85) 30px 31px, transparent 31px 44px),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(36,104,47,.55) 3px 7px, transparent 7px 12px),
      #d23a3f;
  }
  .hidden { display: none !important; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 14px; }
  .tiny { font-size: 12.5px; }

  /* header */
  .brand { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
  .brand img { width: 52px; height: 52px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #fff, 0 0 0 4px rgba(217,169,58,.6); flex: none; }
  .brand h1 { font-size: 22px; }
  .brand .sub { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .who { margin-left: auto; text-align: right; font-size: 14px; line-height: 1.3; }
  .who b { display: block; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; cursor: pointer; font-size: 13.5px; }
  @media (max-width: 560px) {
    .brand .sub, #me-role { display: none; } .brand h1 { font-size: 18px; } .brand img { width: 44px; height: 44px; }
    .who { font-size: 13px; } .who br { display: none; }
  }

  /* nav */
  nav.tabs {
    position: sticky; top: 0; z-index: 20; background: rgba(251,253,251,.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 6px; padding-bottom: 6px; }
  nav.tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; cursor: pointer;
    font-weight: 800; font-size: 14.5px; color: var(--ink-soft); display: inline-flex; gap: 6px; align-items: center;
  }
  .tab[aria-selected="true"] { background: var(--green); color: #fff; }
  .tab .count { background: var(--red); color: #fff; border-radius: 999px; font-size: 11.5px; padding: 0 7px; line-height: 18px; }
  .tab[aria-selected="true"] .count { background: #fff; color: var(--green); }

  main { padding: 18px 0 80px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .stack > * + * { margin-top: 12px; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
  .section-title h2 { font-size: 22px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }

  .btn {
    border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 800; cursor: pointer; font-size: 14.5px;
    background: var(--green); color: #fff; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn.red { background: var(--red); }
  .btn.gold { background: var(--gold); color: #3a2a05; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .btn.sm { padding: 6px 12px; font-size: 13.5px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:focus-visible, .tab:focus-visible, input:focus, select:focus, textarea:focus, .fam-head:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }

  input[type=text], input[type=tel], input[type=email], input[type=search], input[type=password], select, textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px;
  }
  textarea { min-height: 70px; resize: vertical; }
  label.f { display: block; font-weight: 700; font-size: 14px; }
  label.f > input, label.f > select, label.f > textarea { margin-top: 5px; font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
    font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
  .b-pending { background: var(--gold-soft); color: #7a5a08; }
  .b-available { background: var(--blue-soft); color: var(--blue); }
  .b-adopted { background: var(--green-soft); color: var(--green); }
  .b-delivered { background: var(--green); color: #fff; }
  .b-hidden { background: #eee; color: #555; }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-role { background: var(--surface-2); color: #7a5a08; }

  /* stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .stat { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; cursor: pointer; box-shadow: var(--shadow); }
  .stat b { display: block; font-family: "Fraunces", Georgia, serif; font-size: 28px; color: var(--green); line-height: 1.1; }
  .stat span { font-size: 13.5px; color: var(--ink-soft); font-weight: 700; }
  .stat.alert b { color: var(--red); }

  /* lists */
  .help-item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .help-item:first-child { border-top: 0; padding-top: 2px; }
  .help-item .ico { font-size: 22px; flex: none; width: 30px; text-align: center; }
  .help-item .btn { white-space: nowrap; flex: none; }
  .feed-item { padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14.5px; }
  .feed-item:first-child { border-top: 0; }

  .task { border-left: 5px solid var(--gold); }
  .task.claimed { border-left-color: var(--blue); }
  .task.done { border-left-color: var(--green-bright); opacity: .8; }
  .task h3 { font-family: "Nunito", sans-serif; font-size: 16.5px; color: var(--ink); font-weight: 800; }
  .meta { font-size: 13px; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; }

  /* families */
  .fam { padding: 0; overflow: hidden; }
  .fam-head { display: flex; gap: 10px; align-items: center; padding: 14px 16px; cursor: pointer; width: 100%; background: none; border: 0; text-align: left; }
  .fam-head h3 { font-size: 19px; }
  .fam-body { border-top: 1px solid var(--line); padding: 14px 16px 16px; }
  .kidline { font-size: 14px; color: var(--ink-soft); margin-top: 2px; }
  .kid { padding: 8px 0; border-top: 1px dashed var(--line); }
  .kid:first-child { border-top: 0; }
  .block { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .block.private { background: var(--red-soft); border-color: #f3c9cb; }
  .block h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
  .block.private h4 { color: var(--red); }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .step.done { background: var(--green-soft); border-color: var(--green-soft); color: var(--green); }
  .step.now { background: var(--green); border-color: var(--green); color: #fff; }
  .notes { white-space: pre-wrap; font-size: 14px; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 14.5px; }
  dl.kv dt { color: var(--ink-soft); font-weight: 700; }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }

  .story-box { white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--gold); border-radius: 12px; padding: 12px; font-size: 15px; }

  .empty { text-align: center; color: var(--ink-soft); padding: 24px 10px; }
  .banner { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }

  /* login */
  .login { max-width: 440px; margin: 30px auto; }
  .login .logo { display: block; width: 150px; height: 150px; margin: 0 auto 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px #fff, 0 0 0 7px rgba(217,169,58,.55), 0 14px 34px rgba(36,104,47,.16); }
  .login h1 { text-align: center; font-size: 30px; }
  .login .elves { text-align: center; color: var(--ink-soft); margin: 6px 0 18px; font-size: 14.5px; }
  .login .elves b { color: var(--red); }

  /* modal + toast */
  .overlay { position: fixed; inset: 0; background: rgba(20,30,24,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); border-radius: 18px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal img { max-width: 100%; border-radius: 10px; display: block; margin: 0 auto; }
  .codebig { font-family: ui-monospace, Menlo, monospace; font-size: 30px; font-weight: 800; letter-spacing: .08em; text-align: center; background: var(--gold-soft); border: 2px dashed var(--gold); border-radius: 12px; padding: 12px; margin: 10px 0; user-select: all; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.err { background: var(--red); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

    <div>
      <h1>Santa's Operations Hub</h1>
      <div class="sub">Kilted Santa Project · run by the ELVES</div>
    </div>
    <div class="who">
      <b id="me-name"></b>
      <span id="me-role" class="muted"></span><br>
      <button class="linkbtn" id="refresh-btn" type="button">Refresh</button> ·
      <button class="linkbtn" id="logout-btn" type="button">Sign out</button>
    </div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="assertive"></div>

<script>
/* ===================== CONFIG ===================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw3hH_RCsag3kpqohxNVZVGdIiA2f-XzsBlO_8ovpJhGDgUurZkjYJiLKo7wMjt7ljufQ/exec",
  REFRESH_SECONDS: 60
};
/* ================================================== */

const $ = (s, el = document) => el.querySelector(s);
const STORE_KEY = "ks-hub-cred";

/* ---------- tiny DOM helper (text is always set safely) ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else if (k === "checked" || k === "disabled" || k === "selected") el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const opt = (value, label, sel) => h("option", { value, selected: sel }, label ?? value);

/* ---------- storage (per device convenience only) ---------- */
function loadCred() {
  try { const s = localStorage.getItem(STORE_KEY) || sessionStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function saveCred(c, remember) {
  try {
    localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY);
    (remember ? localStorage : sessionStorage).setItem(STORE_KEY, JSON.stringify(c));
  } catch (e) {}
}
function clearCred() { try { localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY); } catch (e) {} }

/* ---------- state ---------- */
let cred = null, me = null, S = null, memCred = null;
const ui = {
  tab: "home", famFilter: null, famSearch: "", open: new Set(), taskFilter: "open", taskArea: "",
  newTask: null, storiesAll: false, crewWants: "", pendingRender: false, busy: false
};

/* ---------- API ---------- */
async function api(action, payload = {}, quiet) {
  const c = cred || memCred;
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ type: "hub", action, login: c.login, code: c.code, ...payload })
  }).then(r => r.json());
  if (res.auth === false) { logout(res.error); throw new Error(res.error); }
  if (!res.ok) { if (!quiet) toast(res.error || "Something went wrong.", true); throw new Error(res.error); }
  if (res.state) { S = res.state; me = res.me; render(!quiet || action !== "state"); }
  if (res.msg && !quiet) toast(res.msg);
  return res;
}
async function act(btn, action, payload) {
  if (btn) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.replaceChildren(h("span", { class: "spin" }), " Saving"); }
  try { return await api(action, payload); }
  catch (e) { if (!/match|paused/.test(e.message || "")) {} return null; }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = btn.dataset.label; } }
}

/* ---------- login / logout ---------- */
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, msg = $("#login-msg");
  const c = { login: f.login.value.trim(), code: f.code.value.trim() };
  msg.classList.add("hidden");
  if (!c.login || !c.code) { msg.textContent = "Please enter your email or phone and your ELF code."; msg.classList.remove("hidden"); return; }
  const btn = $("button[type=submit]", f); btn.disabled = true; btn.textContent = "Checking your code…";
  try {
    const res = await fetch(CONFIG.SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ type: "hub", action: "login", ...c }) }).then(r => r.json());
    if (!res.ok) throw new Error(res.error || "That didn't work.");
    cred = c; memCred = c; saveCred(c, f.remember.checked);
    S = res.state; me = res.me; showApp();
    toast("Welcome, " + firstName(me.name) + "! 🎄");
  } catch (err) {
    msg.textContent = err.message || "We couldn't reach the hub. Check your connection.";
    msg.classList.remove("hidden");
  } finally { btn.disabled = false; btn.textContent = "Open the hub"; }
});
function logout(message) {
  clearCred(); cred = null; memCred = null; me = null; S = null;
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
  const msg = $("#login-msg");
  if (message) { msg.textContent = message; msg.classList.remove("hidden"); } else msg.classList.add("hidden");
}
$("#logout-btn").addEventListener("click", () => logout());
$("#refresh-btn").addEventListener("click", () => refresh(true));

async function refresh(loud) {
  if (!cred && !memCred) return;
  try { await api("state", {}, !loud); if (loud) toast("Up to date ✨"); } catch (e) {}
}
function showApp() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  render();
}
setInterval(() => { if ((cred || memCred) && document.visibilityState === "visible") refresh(false); }, CONFIG.REFRESH_SECONDS * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (cred || memCred)) refresh(false); });

/* ---------- helpers ---------- */
function toast(text, err) {
  const t = h("div", { class: "toast" + (err ? " err" : ""), text });
  $("#toast-root").replaceChildren(t);
  setTimeout(() => t.remove(), err ? 5000 : 2600);
}
function firstName(n) { return String(n || "").split(/[\s(]/)[0] || n; }
function ago(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return iso;
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 7) return Math.floor(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function kidsLine(f, withNames = true) {
  return f.kids.map(k => (withNames && k.name ? k.name : (k.gender || "Child")) + (k.age ? " (" + k.age + ")" : "")).join(", ");
}
function statusBadge(s) {
  const cls = { "Pending review": "b-pending", "Available": "b-available", "Adopted": "b-adopted", "Delivered": "b-delivered", "Not listed": "b-hidden" }[s] || "b-hidden";
  const label = { "Pending review": "Needs review", "Available": "Open for adoption" }[s] || s;
  return h("span", { class: "badge " + cls, text: label });
}
function telLinks(phone, email, name) {
  const p = String(phone || "").replace(/[^\d+]/g, "");
  return h("span", { class: "row" },
    p ? h("a", { class: "btn ghost sm", href: "tel:" + p }, "📞 Call") : null,
    p ? h("a", { class: "btn ghost sm", href: "sms:" + p }, "💬 Text") : null,
    email ? h("a", { class: "btn ghost sm", href: "mailto:" + email }, "✉️ Email") : null);
}
function isEditing() {
  const a = document.activeElement;
  return a && $("#view").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
}
document.addEventListener("focusout", () => setTimeout(() => { if (ui.pendingRender && !isEditing()) render(); }, 50));
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied! Paste it anywhere 📋"); }
  catch (e) {
    const ta = h("textarea", { style: "position:fixed;opacity:0" }); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); toast("Copied!"); } catch (e2) { toast("Couldn't copy. Press and hold to select instead.", true); }
    ta.remove();
  }
}
function modal(...content) {
  const close = () => ov.remove();
  const ov = h("div", { class: "overlay", onclick: e => { if (e.target === ov) close(); } },
    h("div", { class: "modal", role: "dialog", "aria-modal": "true" }, ...content,
      h("div", { class: "row", style: "justify-content:flex-end;margin-top:14px" }, h("button", { class: "btn ghost", onclick: close }, "Close"))));
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
  $("#modal-root").replaceChildren(ov);
  return close;
}
function adoptLink(id) { return (S.publicUrl || new URL("./", location.href).href) + "#adopt-" + id; }
function famById(id) { return S.families.find(f => f.id === id); }

async function viewFile(btn, familyId, which) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Loading…";

    const r = await api("file", { familyId, which }, false);
    const bin = atob(r.data); const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: r.type }));
    const title = (which === "photo" ? "Family photo" : "Proof of address") + " · Family " + familyId;
    if (/^image\//.test(r.type) && !/heic|heif/.test(r.type)) {
      modal(h("h3", { style: "margin-bottom:10px", text: title }), h("img", { src: url, alt: title }),
        h("p", { class: "tiny muted", text: "For checking only. Never posted or shared outside the adoption team." }));
    } else {
      modal(h("h3", { style: "margin-bottom:10px", text: title }),
        h("p", null, "This file is a " + (r.type === "application/pdf" ? "PDF" : "photo your browser can't preview") + "."),
        h("a", { class: "btn", href: url, target: "_blank", rel: "noopener", download: r.name }, "Open it"));
    }
  } catch (e) {} finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = old; } }
}

function storyPost(f) {
  const kids = f.kids.map(k => (k.name || (k.gender === "Boy" ? "a little guy" : k.gender === "Girl" ? "a little girl" : "a kiddo")) + (k.age ? " (" + k.age + ")" : ""));
  const kidsText = kids.length > 1 ? kids.slice(0, -1).join(", ") + " and " + kids[kids.length - 1] : kids[0] || "";
  const lines = ["🎄 Meet Family " + f.id, "", kidsText];
  if (f.story) lines.push("", f.story.trim());
  else {
    const w = f.kids.filter(k => k.wishes).map(k => (k.name || "One of the kids") + " is wishing for " + k.wishes.toLowerCase().replace(/[.!]+$/, ""));
    if (w.length) lines.push("", w.join(". ") + ".");
  }
  lines.push("", "Could you be their Christmas angel? Adopt Family " + f.id + " here:", adoptLink(f.id), "", "#KiltedSantaProject #KiltedSanta");
  return lines.join("\n");
}

        h("div", { class: "row" }, h("b", { text: "Family " + f.id }), statusBadge(f.status)),
        h("div", { class: "story-box", text: text }),
        h("div", { class: "row" },
          h("button", { class: "btn", onclick: () => copyText(text) }, "📋 Copy post"),
          h("button", { class: "btn ghost sm", onclick: () => copyText(adoptLink(f.id)) }, "🔗 Copy link only"),
          f.status !== "Available" ? h("span", { class: "small muted", text: "Already " + f.status.toLowerCase() + ". Post a thank-you instead!" }) : null));
    }) : h("div", { class: "card empty", text: "No stories ready yet. Once an Adoption ELF approves a family who said yes to sharing, their post shows up here." }));
}

/* ---------- start ---------- */
(async function start() {
  try { $("#signup-link").href = new URL("./#volunteer", location.href).href; } catch (e) {}
  const saved = loadCred();
  if (!saved) { $("#login").classList.remove("hidden"); return; }
  cred = saved; memCred = saved;
  $("#login").classList.remove("hidden");
  const form = $("#login-form"); form.login.value = saved.login;
  const btn = $("button[type=submit]", form); btn.disabled = true; btn.textContent = "Opening the hub…";
  try { await api("state", {}, true); showApp(); }
  catch (e) { if (cred) { $("#login-msg").textContent = "We couldn't reach the hub. Check your connection and try again."; $("#login-msg").classList.remove("hidden"); } }
  finally { btn.disabled = false; btn.textContent = "Open the hub"; }
})();
</script>
</body>
</html>
